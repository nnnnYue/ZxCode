    to: shared-ui.model-config-select
    type: shares-component
    rank: must-inspect
  - from: capability.model-selection
    to: surface.user-subagent-form
    type: renders-in
    rank: must-inspect
  - from: surface.user-subagent-form
    to: shared-ui.model-config-select
    type: shares-component
    rank: must-inspect
  - from: capability.model-selection
    to: surface.builtin-subagent-model
    type: renders-in
    rank: must-inspect
  - from: surface.builtin-subagent-model
    to: shared-ui.model-config-select
    type: shares-component
    rank: must-inspect
  - from: surface.conversation-model-control
    to: shared-ui.model-select-groups
    type: options-from
    rank: should-inspect
  - from: surface.user-subagent-form
    to: shared-ui.model-select-groups
    type: options-from
    rank: should-inspect
  - from: surface.builtin-subagent-model
    to: shared-ui.model-select-groups
    type: options-from
    rank: should-inspect
  - from: capability.model-selection
    to: service.host-model-selection
    type: reads-candidates-from
    rank: must-inspect
  - from: service.host-model-selection
    to: state.renderer-model-selection-read
    type: is-read-through
    rank: must-inspect
  - from: state.renderer-model-selection-read
    to: boundary.workspace-key
    type: isolated-by
    rank: must-inspect
    condition:
      Read the selected workspace service; remote-waiting remains unavailable and must not use
      a local fallback.
  - from: capability.automations
    to: surface.automation-edit
    type: renders-in
    rank: must-inspect
  - from: surface.automation-edit
    to: state.automation-form-draft
    type: owns-draft
    rank: must-inspect
  - from: surface.automation-edit
    to: state.renderer-model-selection-read
    type: reads-target-options-through
    rank: should-inspect
  - from: state.automation-form-draft
    to: service.automation
    type: commits-to
    rank: must-inspect
    condition:
      Trace onSubmit through AutomationsSection and the automation management store to the selected
      service; editing a field alone does not mutate a conversation.
  - from: service.automation
    to: persistence.automation-record
    type: persists-to
    rank: must-inspect
  - from: capability.subagents
    to: surface.user-subagent-form
    type: renders-in
    rank: must-inspect
  - from: capability.subagents
    to: surface.builtin-subagent-model
    type: renders-in
    rank: must-inspect
  - from: surface.user-subagent-form
    to: state.subagent-form-draft
    type: owns-draft
    rank: must-inspect
  - from: state.subagent-form-draft
    to: service.subagents
    type: commits-to
    rank: must-inspect
    condition: The form saves through createAgent or updateAgent.
  - from: surface.builtin-subagent-model
    to: service.subagents
    type: commits-to
    rank: must-inspect
    condition: Built-in and plugin overrides use setBuiltInModelOverride and setPluginAgentModelOverride.
  - from: service.subagents
    to: persistence.subagent-markdown
    type: persists-to
    rank: must-inspect
    condition:
      User/workspace definitions use Markdown; built-in/plugin overrides use the agent state
      file. Neither is a live conversation model switch.
  - from: capability.conversation-runtime
    to: service.conversation-command-inbox
    type: admits-commands-through
    rank: must-inspect
  - from: capability.conversation-runtime
    to: state.conversation-product-projection
    type: projects-runtime-events-through
    rank: must-inspect
  - from: state.conversation-product-projection
    to: service.conversation-topic-publisher
    type: publishes-deltas-through
    rank: must-inspect
  - from: service.conversation-topic-publisher
    to: state.conversation-projection
    type: delivers-snapshot-and-deltas-to
    rank: must-inspect
  - from: capability.conversation-runtime
    to: service.zxcode-agent-connection-scope
    type: attaches-through
    rank: must-inspect
  - from: service.conversation-topic-publisher
    to: boundary.desktop-continuous
    type: uses-delivery-policy
    rank: conditional
    condition: For Desktop continuous attachments.
  - from: service.zxcode-agent-connection-scope
    to: boundary.desktop-continuous
    type: injects-trusted-client-mode
    rank: conditional
    condition: For Desktop continuous attachments.
  - from: service.conversation-topic-publisher
    to: boundary.web-remote-replayable
    type: uses-delivery-policy
    rank: conditional
    condition: For replayable Web remote and mobile attachments.
  - from: service.zxcode-agent-connection-scope
    to: boundary.web-remote-replayable
    type: injects-trusted-client-mode
    rank: conditional
    condition: For replayable Web remote and mobile attachments.
  - from: boundary.web-remote-replayable
    to: boundary.desktop-continuous
    type: must-remain-isolated-from
    rank: invariant-only
  - from: state.conversation-projection
    to: service.conversation-command-inbox
    type: must-not-duplicate-admission-of
    rank: invariant-only
    condition:
      The client may display pending optimistic commands; accepted input order and idempotency
      remain CLI-owned.
  - from: capability.workspace-identity
    to: service.workspace-identity-builder
    type: implemented-by
    rank: must-inspect
  - from: service.workspace-identity-builder
    to: boundary.workspace-key
    type: supplies-identity-for
    rank: must-inspect
  - from: service.zxcode-agent-connection-scope
    to: boundary.workspace-key
    type: isolated-by
    rank: must-inspect
  - from: persistence.task-index
    to: boundary.workspace-key
    type: isolated-by
    rank: must-inspect
  - from: persistence.task-index
    to: state.conversation-product-projection
    type: must-not-replace
    rank: invariant-only
    condition: Task index metadata is distinct from canonical conversation content and runtime state.
  - from: capability.composer-trigger-routing
    to: surface.composer-at-context-picker
    type: renders-in
    rank: must-inspect
  - from: capability.composer-trigger-routing
    to: surface.composer-slash-capability-picker
    type: renders-in
    rank: must-inspect
  - from: capability.composer-trigger-routing
    to: surface.composer-skill-compatibility-picker
    type: renders-in
    rank: must-inspect
  - from: surface.composer-at-context-picker
    to: service.composer-host-file-search
    type: options-from
    rank: conditional
    condition:
      Only file candidates use bounded Host file search; other mention providers keep their own
      option sources.
  - from: service.composer-host-file-search
    to: boundary.workspace-key
    type: isolated-by
    rank: must-inspect
  - from: capability.composer-trigger-routing
    to: capability.conversation-runtime
    type: preserves-canonical-input-for
    rank: invariant-only
    condition:
      Changing candidate discovery or grouping must preserve the selected item representation
      submitted to the conversation.
  - from: surface.conversation-model-control
    to: state.composer-submission-intent
    type: edits-draft
    rank: must-inspect
    condition:
      The menu updates the next submission intent even for an existing conversation; it does
      not immediately switch the running model.
  - from: state.composer-submission-intent
    to: service.conversation-submission
    type: submits-selection-to
    rank: must-inspect
    condition: Sending captures modelSelection in the submission; subsequent menu edits affect later sends.
  - from: service.conversation-submission
    to: service.conversation-command-inbox
    type: requires-admission-through
    rank: must-inspect
    condition: V4 commands pass through CommandInbox before the gateway dispatches their handlers.
  - from: service.conversation-submission
    to: service.runtime-submission-execution
    type: schedules-selection-for
    rank: must-inspect
    condition:
      CLI applies admitted configuration when execution starts, or when a Guide reaches the next
      model step.
  - from: service.runtime-submission-execution
    to: state.conversation-product-projection
    type: emits-model-selection-for
    rank: must-inspect
    condition: Applied runtime model selection is projected through ModelSelected events.
  - from: capability.dynamic-workflow
    to: state.dynamic-workflow-availability
    type: delivers-snapshot-and-deltas-to
    rank: must-inspect
    condition:
      Host latches one snapshot from ZXCODE_DYNAMIC_WORKFLOW_MODE (folded by buildHostProcessEnv
      from AppSettings.dynamicWorkflowEnabled and the build tier); the same snapshot feeds the
      session tool policy (workspace/updateDynamicWorkflowPolicy) and the renderer store —
      the UI entry and the model tool face must never diverge. Toggles take effect on the next
      Host process (see specs/dynamic-workflow-setting-toggle.md).
