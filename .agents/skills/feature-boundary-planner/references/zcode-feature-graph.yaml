schemaVersion: 1
graphId: "zcode-feature-relationships"
purpose: "Seed semantic feature-impact discovery; verify every result against the current codegraph index."

rules:
  semanticExpansion: "Follow one meaningful product edge by default."
  codegraphImpactDepth: 2
  maximumCodegraphImpactDepth: 3
  driftPolicy: "Report live callers missing from this graph as graph-drift-candidate; require human confirmation before adding product semantics."
  stableIdPolicy: "Keep node IDs stable; add aliases for terminology changes and multiple codeSeeds for nested call sites on the same product surface."
  persistencePolicy: "In planning modes, write confirmed semantic nodes and edges back to this graph; in impact-only mode, report a proposed graph delta."
  relationRanks:
    - "must-inspect"
    - "should-inspect"
    - "conditional"
    - "invariant-only"
    - "evidence-only"

