      - "Provider/Model Config overlays and Personal updates may be sparse; after resolve, validateComplete supplies diagnostics and Provider/Model requireComplete boundaries are the only path into Registry, whose configs and properties are statically complete."
      - "Concrete Providers resolve from an optional Provider Template baseline followed by Built-in Concrete Provider, Account Config when applicable, and Personal Config; Personal remains the final user override."
