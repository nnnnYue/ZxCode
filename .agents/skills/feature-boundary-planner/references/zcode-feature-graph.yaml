      - "Personal Config cross-process observation uses one asynchronous content-revision polling loop rather than fs.watch; same-process saves publish immediately, other processes self-heal within one interval, and provider connectivity explicitly refreshes the Worker Registry before lookup without creating a Host-side Model path."
      - "Normal Built-in and Account Built-in assembly maintains builtinModelIds while Personal settings maintains modelIds; strict source schemas reject fields outside each source boundary before all inputs enter the shared Provider/Model overlay types."
      - "Model Config enabled is the only per-model execution gate. Built-in general rules provide the complete default, more specific Built-in rules may default-disable retired models, and later Personal provider-model rules express user overrides. Settings retains disabled members for editing and re-enabling, while Registry, selection candidates, defaults, fallbacks, exact ModelFactory creation, tests, and internal tasks reject them. Existing Active Models are not interrupted by a later config refresh."
      - "Model Config has no visibility field. Provider visibility is the only user-facing visibility boundary; hidden complete Providers keep enabled models in the ordinary Registry for exact internal creation but are absent from Settings and Selection facades."
      - "Personal Repository presence is the only authority for whether a normal Provider has been added: standard-builtin overlays are created only by addBuiltinProvider, standard-personal providers only by createPersonalProvider, and ordinary save updates existing overlays without reviving deletion; fixed Z.ai/BigModel Family providers may materialize their first sparse Personal overlay through Family settings."
      - "At the inventory boundary, missing or null collections normalize to empty, Built-in membership wins a cross-source duplicate, and repeated ids within one array retain the first occurrence. Resolver ignores later duplicates deterministically and Settings normalizes Provider-owned arrays on save; no conflict DTO or suspended second identity is created."
      - "Provider modelOrder and Personal top-level providerOrder own user sorting. The shared owned-order algorithm yields unmentioned Built-in + requested valid members + unmentioned Personal; Family Providers remain outside the sortable standard segment. Settings, Registry, and Selection preserve that inventory and filter it without secondary sorting."
      - "Provider group is explicit at root declarations, immutable through Account/Personal overlays, and complete in Effective Provider, Registry, and Settings DTOs; it replaces an additional builtin boolean, and Renderer never infers grouping from ids, preset lists, or Personal map membership."
      - "Effective Model Rules resolve against Effective Provider Config and are composed as ZCode Built-in rules + Personal Match rules + Personal provider-model rules; each group preserves internal order and Personal exact rules always apply last."
      - "ZCode Built-in Model Rules use physical authoring order rather than a priority mechanism: complete baseline, Model Match, Model + API Match, Model + API + Endpoint Match, Provider-scoped Match for service facts that apply to all current/future members, then narrow Provider-Model Exact Rules; Resolver preserves that Built-in order without dynamic specificity sorting."
      - "Z.ai/BigModel Start, Individual, and Team Plan Providers expose Image/Video input for every member because the plan service performs visual-to-text processing before the model API; this is a Provider-scoped Built-in Model Rule and never changes the native capability of ordinary Account API models. Individual and Team static membership is ordered GLM-5.3, GLM-5.3-Flash, GLM-5.2, GLM-5-Turbo, while Start membership remains Account-returned."
      - "Both Built-in and Personal Model Rule sources may use structured provider-model rules for an exact providerId/modelId target or match rules for a target set. Built-in exact rules are release-owned; only Personal exact rules follow Settings rename/delete lifecycle. Match rules are never guessed, renamed, or deleted by Provider/Model lifecycle operations."
      - "The Provider Config chain uses zcodeBuiltin/zcode-builtin naming across domain APIs, source paths, process fields, environment variables, and packaged assets; the unshipped official naming has no alias, fallback, importer, or dual-read compatibility, while unrelated Official MCP/Plugin/CUA concepts retain their own terminology."
      - "Account-type Provider Config does not manage account credentials; Services resolve them at request time and the server makes the final authorization decision."
      - "Account Connection owns current-account facts. Built-in Provider Config owns zhipu-account family/mode; Account Built-in Provider Config projects only entitled and account-specific model membership, while account identity, Coding Plan project keys, Team scope, JWT, and other dynamic credentials stay inside request-time Services."
      - "Start Plan, Individual Coding Plan, Team Coding Plan, and Off-Peak are separate fixed-kind Built-in Providers with enabled=true. Account Built-in overlay marks the compatible current connection entitled without rewriting Provider enabled, and Resolver admits only enabled, entitled, complete Providers to Registry."
      - "Welcome manual API-key setup locates the fixed zai-api or bigmodel-api Built-in Provider and saves only a sparse Personal Provider Overlay. It does not create a custom Provider, copy Built-in endpoint/schema/models, enter Account Request Auth, or mutate an existing explicit Family Connection Selection."
      - "Off-Peak request auth combines ZCode JWT, the compatible Coding Plan project key, and the Off-Peak ticket through one Registry-backed host-private credential resolver. Desktop Host dispatch does not scan Provider Settings or independently infer the current account Provider."
      - "Five strict input schemas enforce ZCode Built-in Provider, Account Provider, Personal Provider, ZCode Built-in Model Rule, and Personal Model Rule field ownership before common overlay and completeness validation. UI visibility remains a separate presentation decision."
      - "Provider Access owns challenge, requestSigning, and executionProtocol product protocols; Model Config and Runtime do not infer Captcha, V4 signing, or Off-Peak behavior from model/provider ids."
      - "A request-auth Provider receives dynamic credentials per request and fails before network I/O when they are absent."
      - "RuntimeModelFactoryInput cannot override Registry-owned context, properties, or provider options; execution-scoped MCS force is consumed where Provider messages are projected, including Full Compact, and never becomes Model Config or a ModelFactory capability input."
      - "Published Legacy Provider store shapes may be parsed only by importer-private Services types and helpers; they are not Shared, Protocol, UI, Registry, Runtime, or test-fixture contracts."
      - "The unversioned Legacy CLI importer migrates only explicitly represented facts without capability guesses; after the forced-upgrade compatibility window it and its legacy parser dependencies are removed, while normal schemaVersion migrations remain."
      - "Core uses ModelSelection for future intent and Model for active execution; it does not call a model Adapter or query a physical Provider Connection."
      - "The business Provider Registry is the only Provider/Model fact registry; Adapter execution projections and caches are one-way private implementation details."
      - "Model identity does not carry reasoning options; do not introduce a general ModelIdentity while ModelSelection, Model, or local event fields already express the required semantics."
      - "reasoningLevel.values is ordered from the lowest to the highest public level; default remains the ordinary request default, while explicitly low-cost auxiliary calls, including Provider connectivity, uniformly select values[0] without guessing disabled aliases."

